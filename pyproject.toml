[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tcginventory"
version = "0.0.1"
description = "Local desktop app for tracking a personal + business trading card inventory (Pokémon-focused)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Cole" }]
dependencies = [
    "PySide6>=6.6",
    "httpx>=0.27",
    "numpy>=1.26",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "pyinstaller>=6.0",
]
# Enables the DINOv2 ONNX identifier (else a lightweight fallback embedder is
# used). Install with `pip install -e ".[vision]"` and drop the model at
# <data_dir>/vision/models/dinov2_small.onnx.
vision = [
    "onnxruntime>=1.17",
]

[project.gui-scripts]
tcginventory = "tcginventory.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"tcginventory.data" = ["migrations/*.sql"]
"tcginventory.ui" = ["assets/*.png", "assets/*.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
