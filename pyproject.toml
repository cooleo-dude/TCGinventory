[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tcginventory"
# Single source of truth: src/tcginventory/__init__.py. setuptools reads the
# literal without importing the package, so this cannot drift from what the
# window title, the splash and the frozen exe display.
dynamic = ["version"]
description = "Local desktop app for tracking a personal + business trading card inventory (Pokémon-focused)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Cole" }]
dependencies = [
    "PySide6>=6.6",
    "httpx>=0.27",
    "numpy>=1.26",
    "Pillow>=10.0",
    # DINOv2 identifier backend; the model itself ships as package data (LFS).
    "onnxruntime>=1.17",
    # Whisper runtime for voice search (ticket 76); the model ships as package
    # data (LFS) like the identifier.
    "sherpa-onnx>=1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.5",
    "ruff>=0.5",
    "pyinstaller>=6.0",
]

[project.gui-scripts]
tcginventory = "tcginventory.app:main"

[tool.setuptools.dynamic]
version = { attr = "tcginventory.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"tcginventory.data" = ["migrations/*.sql"]
"tcginventory.ui" = [
    "assets/*.png",
    "assets/*.ico",
    "assets/*.gif",
    "assets/fonts/*.ttf",
    "assets/icons/*.svg",
]
"tcginventory" = ["models/*.onnx", "models/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Parallel by default: the suite is ~640 mostly-independent tests and takes
# ~49s serially, ~9s across workers. ``--dist loadfile`` keeps a file's tests
# on one worker, which matters here — the Qt views carry module-level state,
# and it avoids re-importing PySide6/numpy in every worker for every file.
# Running one file while iterating? ``-n0`` turns it off (450ms vs 2s).
addopts = "-q -n auto --dist loadfile"

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
